<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অর্ডার ম্যানেজমেন্ট - SERA PRODUCT ADMIN</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#ff6a00',
                            hover: '#e05d00',
                            light: '#fff5ee'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans antialiased">

    <!-- App Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="https://seraproduct.com/photo/logo.png" alt="SERA PRODUCT" class="h-9 w-auto object-contain" onerror="this.src='https://via.placeholder.com/150x40?text=SERA+PRODUCT'">
                <span class="text-xl font-bold text-gray-900 hidden sm:inline">অর্ডার ম্যানেজমেন্ট</span>
            </div>
            <div class="flex items-center gap-3" id="userInfo">
                <div class="text-right hidden sm:block">
                    <p id="userEmail" class="text-sm font-medium text-gray-700">লোড হচ্ছে...</p>
                    <span id="userBadge" class="inline-block text-xs px-2 py-0.5 rounded-full font-semibold bg-gray-100 text-gray-600">...</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- Controls / Search & Filters -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                
                <!-- Search by Order ID -->
                <div>
                    <label for="searchInput" class="block text-xs font-semibold text-gray-600 mb-1">অর্ডার আইডি দিয়ে খুঁজুন</label>
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="যেমন: S-P-9904093-SP-ORDER" 
                            class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand focus:border-brand outline-none">
                        <div class="absolute left-3 top-2.5 text-gray-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        </div>
                    </div>
                </div>

                <!-- Status Filter -->
                <div>
                    <label for="statusFilter" class="block text-xs font-semibold text-gray-600 mb-1">অর্ডারের অবস্থা নির্বাচন করুন</label>
                    <select id="statusFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand focus:border-brand outline-none bg-white">
                        <option value="all">সব অর্ডার</option>
                        <option value="pending">নতুন অর্ডার</option>
                        <option value="confirm">অর্ডার গ্রহণ করা হয়েছে!</option>
                        <option value="processing">কোরিয়ারে পাঠানো হয়েছে!</option>
                        <option value="cancel">অর্ডার বাতিল করা হয়েছে!</option>
                        <option value="return">অর্ডার রিটার্ন করা হয়েছে!</option>
                        <option value="delivery">অর্ডার সফল ভাবে ডেলিভারি করা হয়েছে!</option>
                    </select>
                </div>

                <!-- Reset Filter Button -->
                <div class="flex items-end">
                    <button id="resetFilterBtn" class="w-full md:w-auto px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 flex items-center justify-center gap-2">
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        ফিল্টার রিকলিয়ার
                    </button>
                </div>
            </div>
        </div>

        <!-- Orders Grid / List -->
        <div id="ordersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
            <!-- Cards will be dynamically appended here -->
        </div>

        <!-- Empty & Loading States -->
        <div id="loadingState" class="hidden py-12 text-center">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-brand border-t-transparent mb-2"></div>
            <p id="loadingText" class="text-gray-600 text-sm font-medium">অর্ডার লোড হচ্ছে...</p>
        </div>

        <div id="emptyState" class="hidden py-16 text-center bg-white rounded-xl border border-gray-200">
            <svg class="w-12 h-12 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
            <p id="emptyMessage" class="text-gray-500 font-medium">কোনও অর্ডার পাওয়া যায়নি।</p>
        </div>

        <!-- Load More Button -->
        <div id="loadMoreContainer" class="hidden text-center mt-6">
            <button id="loadMoreBtn" class="px-6 py-2.5 bg-white border border-brand text-brand hover:bg-brand-light font-semibold rounded-lg text-sm transition-colors shadow-sm inline-flex items-center gap-2">
                <span>আরও দেখুন</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
        </div>

    </main>

    <!-- Details Full Screen / Large Modal -->
    <div id="detailsModal" class="fixed inset-0 z-40 hidden overflow-y-auto modal-backdrop flex items-center justify-center p-2 sm:p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden my-auto border border-gray-200">
            
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between bg-gray-50">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    <h2 class="text-lg font-bold text-gray-900" id="modalOrderId">অর্ডারের বিস্তারিত</h2>
                </div>
                <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600 p-1 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <!-- Modal Body -->
            <div id="modalBody" class="p-6 overflow-y-auto space-y-6">
                <!-- Dynamic Content Load -->
            </div>
        </div>
    </div>

    <!-- Custom Confirmation Modal -->
    <div id="confirmModal" class="fixed inset-0 z-50 hidden modal-backdrop flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 border border-gray-200 text-center">
            <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            </div>
            <h3 class="text-lg font-bold text-gray-900 mb-2" id="confirmTitle">নিশ্চিত করুন</h3>
            <p class="text-sm text-gray-600 mb-6" id="confirmMessage">আপনি কি এই কাজটি সম্পন্ন করতে চান?</p>
            <div class="flex gap-3 justify-end">
                <button id="confirmCancelBtn" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">বাতিল</button>
                <button id="confirmOkBtn" class="px-4 py-2 bg-brand text-white rounded-lg text-sm font-medium hover:bg-brand-hover">হ্যাঁ, নিশ্চিত করুন</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-900 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 text-sm">
        <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        <span id="toastMessage">বিজ্ঞপ্তি</span>
    </div>

    <!-- Firebase SDK Modular Import -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            getDoc, 
            getDocs, 
            updateDoc, 
            query, 
            where, 
            orderBy, 
            limit, 
            startAfter,
            setDoc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // Firebase Configuration (Replace with active credentials if needed)
        // ==========================================
    const firebaseConfig = {
  apiKey: "AIzaSyBRSt2aoSJ-lumYAWGAXE6ncui7__TqJ4E",
  authDomain: "sera-product.firebaseapp.com",
  projectId: "sera-product",
  storageBucket: "sera-product.firebasestorage.app",
  messagingSenderId: "516762224598",
  appId: "1:516762224598:web:b6a571f355a8a4a97c0677",
  measurementId: "G-RLMWH43FXX"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Owners List
        const OWNER_EMAILS = [
            "shohidhossain@gmail.com",
            "nazrulislam887441234@gmail.com",
            "support.seraproduct@gmail.com"
        ];

        // Status Translations
        const STATUS_MAP = {
            "pending": "নতুন অর্ডার",
            "confirm": "অর্ডার গ্রহণ করা হয়েছে!",
            "processing": "কোরিয়ারে পাঠানো হয়েছে!",
            "cancel": "অর্ডার বাতিল করা হয়েছে!",
            "return": "অর্ডার রিটার্ন করা হয়েছে!",
            "delivery": "অর্ডার সফল ভাবে ডেলিভারি করা হয়েছে!"
        };

        const STATUS_COLORS = {
            "pending": "bg-amber-100 text-amber-800 border-amber-200",
            "confirm": "bg-blue-100 text-blue-800 border-blue-200",
            "processing": "bg-indigo-100 text-indigo-800 border-indigo-200",
            "cancel": "bg-red-100 text-red-800 border-red-200",
            "return": "bg-purple-100 text-purple-800 border-purple-200",
            "delivery": "bg-green-100 text-green-800 border-green-200"
        };

        // Application State
        let currentUser = null;
        let userRole = null;
        let lastVisibleDoc = null;
        let isLoading = false;
        let currentFilterStatus = 'all';
        let currentSearchQuery = '';
        let confirmResolver = null;

        // DOM Elements
        const ordersContainer = document.getElementById('ordersContainer');
        const loadingState = document.getElementById('loadingState');
        const loadingText = document.getElementById('loadingText');
        const emptyState = document.getElementById('emptyState');
        const emptyMessage = document.getElementById('emptyMessage');
        const loadMoreContainer = document.getElementById('loadMoreContainer');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');
        const resetFilterBtn = document.getElementById('resetFilterBtn');

        // Modal Elements
        const detailsModal = document.getElementById('detailsModal');
        const modalOrderId = document.getElementById('modalOrderId');
        const modalBody = document.getElementById('modalBody');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // Confirmation Modal Elements
        const confirmModal = document.getElementById('confirmModal');
        const confirmTitle = document.getElementById('confirmTitle');
        const confirmMessage = document.getElementById('confirmMessage');
        const confirmCancelBtn = document.getElementById('confirmCancelBtn');
        const confirmOkBtn = document.getElementById('confirmOkBtn');

        // Initialize Authentication & Authorization
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                redirectToUnauthorized();
                return;
            }

            currentUser = user;
            const email = (user.email || "").toLowerCase();

            // Check if Owner
            if (OWNER_EMAILS.includes(email)) {
                userRole = 'Owner';
                setupUserUI(user.email, 'Owner');
                initApp();
                return;
            }

            // Check if Admin
            try {
                const adminDocRef = doc(db, "admins", user.uid);
                const adminDocSnap = await getDoc(adminDocRef);

                if (adminDocSnap.exists()) {
                    const adminData = adminDocSnap.data();
                    if (adminData.active === true && adminData.uid === user.uid && adminData.email === user.email && adminData.name) {
                        userRole = 'Admin';
                        setupUserUI(user.email, 'Admin');
                        initApp();
                        return;
                    }
                }
                // Validation failed
                redirectToUnauthorized();
            } catch (error) {
                console.error("Auth check failed:", error);
                redirectToUnauthorized();
            }
        });

        function redirectToUnauthorized() {
            window.location.href = "https://admin.seraproduct.com";
        }

        function setupUserUI(email, role) {
            document.getElementById('userEmail').innerText = email;
            const badge = document.getElementById('userBadge');
            badge.innerText = role;
            if (role === 'Owner') {
                badge.className = "inline-block text-xs px-2.5 py-0.5 rounded-full font-semibold bg-orange-100 text-brand border border-orange-200";
            } else {
                badge.className = "inline-block text-xs px-2.5 py-0.5 rounded-full font-semibold bg-blue-100 text-blue-700 border border-blue-200";
            }
        }

        // Initialize App Operations
        function initApp() {
            fetchOrders(true);
            setupEventListeners();
        }

        function setupEventListeners() {
            // Status filter change
            statusFilter.addEventListener('change', (e) => {
                currentFilterStatus = e.target.value;
                currentSearchQuery = '';
                searchInput.value = '';
                fetchOrders(true);
            });

            // Search input handling (Debounced or Enter)
            let searchTimeout = null;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                const query = e.target.value.trim();
                searchTimeout = setTimeout(() => {
                    currentSearchQuery = query;
                    fetchOrders(true);
                }, 500);
            });

            resetFilterBtn.addEventListener('click', () => {
                statusFilter.value = 'all';
                searchInput.value = '';
                currentFilterStatus = 'all';
                currentSearchQuery = '';
                fetchOrders(true);
            });

            loadMoreBtn.addEventListener('click', () => {
                if (!isLoading && lastVisibleDoc) {
                    fetchOrders(false);
                }
            });

            closeModalBtn.addEventListener('click', hideDetailsModal);

            // Confirmation Modal Actions
            confirmCancelBtn.addEventListener('click', () => {
                confirmModal.classList.add('hidden');
                if (confirmResolver) confirmResolver(false);
            });

            confirmOkBtn.addEventListener('click', () => {
                confirmModal.classList.add('hidden');
                if (confirmResolver) confirmResolver(true);
            });
        }

        // Custom Confirm Function (Replaces window.confirm)
        function showConfirm(title, message) {
            return new Promise((resolve) => {
                confirmTitle.innerText = title || "নিশ্চিত করুন";
                confirmMessage.innerText = message || "আপনি কি এই কাজটিতে এগিয়ে যেতে চান?";
                confirmResolver = resolve;
                confirmModal.classList.remove('hidden');
            });
        }

        // Toast Notification System
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Fetch Orders with Paginated Query & Filter Structure
        async function fetchOrders(isNewQuery = false) {
            if (isLoading) return;
            isLoading = true;

            if (isNewQuery) {
                ordersContainer.innerHTML = '';
                lastVisibleDoc = null;
                emptyState.classList.add('hidden');
            }

            loadMoreContainer.classList.add('hidden');
            loadingState.classList.remove('hidden');
            loadingText.innerText = isNewQuery ? "অর্ডার লোড হচ্ছে..." : "আরও অর্ডার লোড হচ্ছে...";

            try {
                let q;

                // Case 1: Search by exact Order ID
                if (currentSearchQuery !== '') {
                    q = query(
                        collection(db, "orders"),
                        where("orderId", "==", currentSearchQuery)
                    );
                } 
                // Case 2: Filter by Status
                else if (currentFilterStatus !== 'all') {
                    if (isNewQuery) {
                        q = query(
                            collection(db, "orders"),
                            where("status", "==", currentFilterStatus),
                            orderBy("createdAt", "desc"),
                            limit(20)
                        );
                    } else {
                        q = query(
                            collection(db, "orders"),
                            where("status", "==", currentFilterStatus),
                            orderBy("createdAt", "desc"),
                            startAfter(lastVisibleDoc),
                            limit(20)
                        );
                    }
                } 
                // Case 3: Load All (Default Paginated)
                else {
                    if (isNewQuery) {
                        q = query(
                            collection(db, "orders"),
                            orderBy("createdAt", "desc"),
                            limit(20)
                        );
                    } else {
                        q = query(
                            collection(db, "orders"),
                            orderBy("createdAt", "desc"),
                            startAfter(lastVisibleDoc),
                            limit(20)
                        );
                    }
                }

                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty && isNewQuery) {
                    loadingState.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                    if (currentSearchQuery !== '') {
                        emptyMessage.innerText = "এই অর্ডার আইডির কোনো অর্ডার পাওয়া যায়নি।";
                    } else if (currentFilterStatus !== 'all') {
                        emptyMessage.innerText = "এই অবস্থার কোনো অর্ডার পাওয়া যায়নি।";
                    } else {
                        emptyMessage.innerText = "কোনও অর্ডার পাওয়া যায়নি।";
                    }
                    isLoading = false;
                    return;
                }

                if (!querySnapshot.empty) {
                    lastVisibleDoc = querySnapshot.docs[querySnapshot.docs.length - 1];
                    querySnapshot.forEach(docSnap => {
                        renderOrderCard(docSnap.id, docSnap.data());
                    });

                    // Show 'Load More' if full page returned and not exact ID search
                    if (querySnapshot.docs.length === 20 && currentSearchQuery === '') {
                        loadMoreContainer.classList.remove('hidden');
                    }
                }

            } catch (error) {
                console.error("Error loading orders:", error);
                showToast("তথ্য লোড করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।");
            } finally {
                loadingState.classList.add('hidden');
                isLoading = false;
            }
        }

        // Defensive Data Extractors
        function safeGet(val, fallback = '—') {
            return (val !== null && val !== undefined && val !== '') ? val : fallback;
        }

        // Compact Order Card Rendering
        function renderOrderCard(docId, data) {
            const orderId = safeGet(data.orderId);
            const name = safeGet(data.name, 'নাম পাওয়া যায়নি');
            const phone = safeGet(data.phone, 'ফোন পাওয়া যায়নি');
            const statusKey = safeGet(data.status, 'pending');
            const statusBn = STATUS_MAP[statusKey] || statusKey;
            const statusColor = STATUS_COLORS[statusKey] || "bg-gray-100 text-gray-800 border-gray-200";

            const cardHtml = `
                <div id="card-${docId}" class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between">
                    <div>
                        <div class="flex items-start justify-between gap-2 mb-3">
                            <span class="text-xs font-bold text-gray-500 tracking-wider uppercase">${orderId}</span>
                            <span id="badge-${docId}" class="text-xs font-semibold px-2.5 py-1 rounded-full border ${statusColor}">
                                ${statusBn}
                            </span>
                        </div>

                        <div class="space-y-1.5 mb-4">
                            <p class="text-base font-bold text-gray-900">${name}</p>
                            <p class="text-sm text-gray-600 flex items-center gap-1.5">
                                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                                <span>${phone}</span>
                            </p>
                        </div>

                    <div class="pt-3 border-t border-gray-100 space-y-3">

                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>

            ordersContainer.insertAdjacentHTML('beforeend', cardHtml);
        }

        // Window level bridge for Card Status Change
        window.handleStatusChangeCard = async function(docId, newStatus, oldStatus) {
            if (newStatus === oldStatus) return;

            const confirmed = await showConfirm(
                "অর্ডারের অবস্থা পরিবর্তন",
                `আপনি কি অর্ডারের অবস্থা "${STATUS_MAP[newStatus]}" এ পরিবর্তন করতে চান?`
            );

            if (!confirmed) {
                // Reset select UI if canceled
                fetchOrders(true);
                return;
            }

            try {
                const orderRef = doc(db, "orders", docId);
                await updateDoc(orderRef, { status: newStatus });
                
                // Update Local UI State defensive
                const badge = document.getElementById(`badge-${docId}`);
                if (badge) {
                    badge.innerText = STATUS_MAP[newStatus];
                    badge.className = `text-xs font-semibold px-2.5 py-1 rounded-full border ${STATUS_COLORS[newStatus]}`;
                }
                showToast("অর্ডারের অবস্থা পরিবর্তন করা হয়েছে।");
            } catch (error) {
                console.error("Status update failed:", error);
                showToast("অর্ডারের অবস্থা পরিবর্তন করা যায়নি।");
                fetchOrders(true);
            }
        };

        // Date Formatter
        function formatBengaliDate(rawDate) {
            if (!rawDate) return 'তারিখ পাওয়া যায়নি';
            let dateObj;

            if (rawDate.seconds) {
                dateObj = new Date(rawDate.seconds * 1000);
            } else {
                dateObj = new Date(rawDate);
            }

            if (isNaN(dateObj.getTime())) return 'অকার্যকর তারিখ';

            const monthsBn = [
                "জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন",
                "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"
            ];

            const convertToBnDigit = (num) => {
                const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
                return String(num).replace(/\d/g, d => bnDigits[d]);
            };

            const day = convertToBnDigit(dateObj.getDate());
            const month = monthsBn[dateObj.getMonth()];
            const year = convertToBnDigit(dateObj.getFullYear());
            
            let hours = dateObj.getHours();
            const minutes = convertToBnDigit(String(dateObj.getMinutes()).padStart(2, '0'));
            const period = hours >= 12 ? 'বিকাল' : 'সকাল';
            hours = hours % 12 || 12;
            const hoursBn = convertToBnDigit(hours);

            return `${day} ${month} ${year}, ${period} ${hoursBn}:${minutes}`;
        }

        // Fetch Single Document Details ("সব তথ্য দেখুন")
        window.viewOrderDetails = async function(docId) {
            detailsModal.classList.remove('hidden');
            modalBody.innerHTML = `

                    <p class="text-gray-600 text-sm font-medium">বিস্তারিত তথ্য লোড হচ্ছে...</p>
                </div>

            try {
                const orderRef = doc(db, "orders", docId);
                const orderSnap = await getDoc(orderRef);

                if (!orderSnap.exists()) {
                    modalBody.innerHTML = `<p class="text-center text-red-500 font-medium">অর্ডারের নথিটি পাওয়া যায়নি।</p>`;

                const data = orderSnap.data();
                modalOrderId.innerText = `অর্ডার আইডি: ${safeGet(data.orderId)}`;

                const customerUid = safeGet(data.uid, null);

                        const buyerSnap = await getDoc(doc(db, "buyers", customerUid));
                        if (buyerSnap.exists()) {

                        console.error("Buyer doc fetch error:", e);

                renderDetailsModalContent(docId, data, buyerData, customerUid);

        function hideDetailsModal() {
            detailsModal.classList.add('hidden');

        // Render Comprehensive Modal Content

            const deliveryCharge = data.deliveryCharge || 0;
            const subtotal = data.subtotal || 0;
            const total = data.total || 0;
            const discount = data.discount || 0;

            // Product List HTML Construction
            const products = Array.isArray(data.productItem) ? data.productItem : [];

            if (products.length === 0) {
                productsHtml = `<p class="text-gray-500 text-sm italic">কোনো প্রোডাক্ট পাওয়া যায়নি।</p>`;

                productsHtml = products.map((item, idx) => {

                    const pImg = safeGet(item.productImage, '');

                    const pPrice = safeGet(item.productPrice, 0);
                    const isFreeDev = item.freeDelivery === true;

                    // Variants Processing

                    if (Array.isArray(item.variants) && item.variants.length > 0) {
                        variantsHtml = item.variants.map(v => {
                            const vName = safeGet(v.name, 'ভ্যারিয়েন্ট');
                            const vVal = safeGet(v.value, '');
                            const extra = v.extraPrice;
                            const hasExtra = (extra !== null && extra !== undefined && Number(extra) > 0);

                            return `

                                    <span class="font-semibold">${vName}:</span> ${vVal}

                                </div>
                            `;
                        }).join('');
                    }

                    return `
                        <div class="flex flex-col sm:flex-row gap-4 p-4 border border-gray-200 rounded-lg bg-white shadow-sm">
                            <div class="w-20 h-20 bg-gray-100 rounded-lg overflow-hidden flex-shrink-0 border border-gray-200">
                                <img src="${pImg}" alt="${pName}" class="w-full h-full object-cover" 
                                    onerror="this.onerror=null; this.src='https://via.placeholder.com/80?text=No+Image';">
                            </div>
                            <div class="flex-grow space-y-1">
                                <h4 class="font-bold text-gray-900 text-base">${pName}</h4>
                                <p class="text-sm text-gray-600">পরিমাণ: ${pQty} টি</p>
                                <p class="text-sm font-semibold text-brand">এই প্রোডাক্টের জন্য মোট: ৳${pPrice} নেওয়া হয়েছে।</p>
                                ${isFreeDev ? `<span class="inline-block bg-green-100 text-green-800 text-xs px-2 py-0.5 rounded font-medium mt-1">এই পণ্যটার জন্য ফ্রি ডেলিভারি!</span>` : ''}
                                ${variantsHtml}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            modalBody.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    
                    <!-- Left Column: Customer & Delivery Info -->
                    <div class="space-y-4">
                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-3">
                            <h3 class="text-sm font-bold text-gray-900 border-b border-gray-200 pb-2 flex items-center gap-1.5">
                                <svg class="w-4 h-4 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                                কাস্টমার তথ্য
                            </h3>

                            <div class="text-sm space-y-2">
                                <p><span class="font-medium text-gray-500">কাস্টমারের নাম:</span> <strong class="text-gray-900">${safeGet(data.name)}</strong></p>
                                
                                <div class="flex items-center justify-between flex-wrap gap-2">
                                    <div>
                                        <span class="font-medium text-gray-500">কাস্টমারের ফোন:</span> 
                                        <a href="tel:${phone}" class="font-bold text-brand hover:underline inline-flex items-center gap-1">
                                            ${phone}
                                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                                        </a>
                                    </div>
                                    <button onclick="window.copyToClipboard('${phone}')" class="text-xs bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 px-2.5 py-1 rounded flex items-center gap-1">
                                        <svg class="w-3.5 h-3.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                        কপি করুন
                                    </button>
                                </div>

                                <p><span class="font-medium text-gray-500">ইমেইল:</span> <span class="text-gray-800">${safeGet(data.email)}</span></p>
                                <p><span class="font-medium text-gray-500">উপজেলা/থানা:</span> <span class="text-gray-800">${safeGet(data.thana)}</span></p>
                                <p><span class="font-medium text-gray-500">জেলা:</span> <span class="text-gray-800">${safeGet(data.jela)}</span></p>
                                <p><span class="font-medium text-gray-500">বিভাগ:</span> <span class="text-gray-800">${safeGet(data.vibag)}</span></p>
                                <p><span class="font-medium text-gray-500">ডেলিভারি স্থান:</span> <span class="text-gray-800">${deliverySiteBn}</span></p>
                                
                                <div class="pt-2 border-t border-gray-200">
                                    <span class="font-medium text-gray-500 block mb-1">নোট:</span>
                                    <p class="text-xs bg-white p-2.5 rounded border border-gray-200 text-gray-700">${noteText}</p>
                                </div>

                                <div class="pt-2 border-t border-gray-200 flex items-center justify-between flex-wrap gap-2">
                                    <div>
                                        <span class="font-medium text-gray-500">ইউআইডি:</span>
                                        <span class="text-xs font-mono bg-gray-200 px-1.5 py-0.5 rounded text-gray-800">${safeGet(customerUid)}</span>
                                    </div>

                                    <!-- Block / Unblock Button -->
                                    <button onclick="window.toggleCustomerBlock('${customerUid}', ${isBlocked})" 
                                        class="text-xs px-3 py-1.5 rounded font-semibold transition-colors flex items-center gap-1 ${isBlocked ? 'bg-green-600 hover:bg-green-700 text-white' : 'bg-red-600 hover:bg-red-700 text-white'}">

                                        ${isBlocked ? 'আনব্লক করুন' : 'ব্লক করুন'}

                                </div>
                            </div>
                        </div>

                        <!-- Order Meta Info -->
                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-2 text-sm">
                            <p><span class="font-medium text-gray-500">অর্ডার করা হয়েছে:</span> <span class="text-gray-900 font-medium">${createdAtBn}</span></p>

                    <div class="space-y-4">

                            <svg class="w-4 h-4 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                            অর্ডার করা প্রোডাক্ট সমূহ
                        </h3>

                        <div class="space-y-3 max-h-80 overflow-y-auto pr-1">
                            ${productsHtml}

                        <!-- Price Breakdown Card -->
                        <div class="bg-orange-50 border border-orange-200 p-4 rounded-xl space-y-2 text-sm text-gray-800">
                            <p class="flex justify-between">
                                <span>ডেলিভারি চার্জ ছাড়া:</span>
                                <strong>৳${subtotal} টাকা নেওয়া হয়েছে!</strong>
                            </p>
                            <p class="flex justify-between">
                                <span>প্রোডাক্ট ডেলিভারি চার্জ:</span>
                                <strong>৳${deliveryCharge}</strong>
                            </p>
                            ${discount > 0 ? `
                                <p class="flex justify-between text-green-700">
                                    <span>ডিসকাউন্ট:</span>
                                    <strong>- ৳${discount}</strong>
                                </p>
                            ` : ''}
                            <div class="border-t border-orange-200 pt-2 mt-2 flex justify-between text-base font-bold text-brand">
                                <span>সর্বমোট মূল্য:</span>
                                <span>৳${total} টাকা নেওয়া হয়েছে!</span>
                            </div>
                        </div>
                    </div>

                </div>
            `;
        }

        // Phone Copy to Clipboard API with Fallback
        window.copyToClipboard = function(text) {
            if (!text) return;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast("ফোন নম্বর কপি হয়েছে।");
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        };

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("ফোন নম্বর কপি হয়েছে।");
            } catch (err) {
                showToast("কপি করা সম্ভব হয়নি।");
            }
            document.body.removeChild(textArea);
        }

        // Customer Block / Unblock Action Logic
        window.toggleCustomerBlock = async function(uid, isCurrentlyBlocked) {
            if (!uid || uid === 'null' || uid === '—') {
                showToast("এই কাস্টমারের তথ্য পাওয়া যায়নি।");
                return;
            }

            const actionText = isCurrentlyBlocked ? "আনব্লক" : "ব্লক";
            const confirmed = await showConfirm(
                `কাস্টমার ${actionText}`,
                `আপনি কি এই কাস্টমারকে ${actionText} করতে চান?`
            );

            if (!confirmed) return;

            try {
                const buyerRef = doc(db, "buyers", uid);
                const buyerSnap = await getDoc(buyerRef);

                if (!buyerSnap.exists()) {
                    showToast("এই কাস্টমারের তথ্য পাওয়া যায়নি।");
                    return;
                }

                await updateDoc(buyerRef, {
                    block: !isCurrentlyBlocked
                });

                showToast(`কাস্টমার সফলভাবে ${actionText} করা হয়েছে।`);
                hideDetailsModal();

            } catch (error) {
                console.error("Block toggle error:", error);
                showToast("কাস্টমারের ব্লক অবস্থা পরিবর্তন করা যায়নি।");
            }
        };

    </script>
</body>
