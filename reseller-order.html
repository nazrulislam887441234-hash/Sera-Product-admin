<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রিসেলার অর্ডার ম্যানেজমেন্ট - SERA PRODUCT ADMIN</title>
    <link rel="icon" href="https://seraproduct.com/photo/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reseller-order.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo-area">
                <img src="https://seraproduct.com/photo/logo.png" alt="Sera Product Logo">
                <h1>রিসেলার অর্ডার ম্যানেজমেন্ট</h1>
            </div>
            <div class="user-meta">
                <span id="userBadge" class="badge">যাচাই হচ্ছে...</span>
                <span id="userEmailDisplay" class="user-email"></span>
                <button id="btnLogout" class="btn-logout" style="display: none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    লগআউট
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Controls & Search -->
        <div class="controls-card">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="রিসেলার ইউআইডি, অর্ডার আইডি বা কাস্টমার ফোন দিয়ে খুঁজুন...">
                <button id="searchBtn" class="btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    খুঁজুন
                </button>
                <button id="clearSearchBtn" class="btn btn-secondary" style="display: none;">রিসেট</button>
            </div>
        </div>

        <!-- Orders Section -->
        <section class="orders-section">
            <div class="section-header">
                <h2>সকল রিসেলার অর্ডার</h2>
                <span id="orderCount" style="font-size: 0.9rem; color: var(--text-muted); font-weight: 500;"></span>
            </div>
            <div id="ordersGrid" class="orders-grid">
                <!-- Skeletons initially -->
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
            <div class="pagination-container">
                <button id="loadMoreBtn" class="btn btn-secondary" style="display: none;">
                    আরও দেখুন
                </button>
            </div>
        </section>
    </main>

    <!-- Modal for Full Information -->
    <div id="orderModal" class="modal-backdrop">
        <div class="modal-content">
            <div class="modal-header">
                <h3>সম্পূর্ণ অর্ডার বিবরণ</h3>
                <button class="modal-close" id="modalCloseBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body" id="modalBodyContent">
                <!-- Dynamic Content injected here -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modalCloseActionBtn">বন্ধ করুন</button>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal for Delivery/Return -->
    <div id="confirmModal" class="modal-backdrop">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h3 id="confirmModalTitle">অপারেশন কনফার্মেশন</h3>
                <button class="modal-close" id="confirmModalCloseBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body" id="confirmModalBodyContent">
                <!-- Dynamic Calculation injected here -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="confirmModalCancelBtn">বাতিল</button>
                <button class="btn" id="confirmModalActionBtn" style="background: var(--primary);">নিশ্চিত করুন</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>
<script type="module" src="reseller-order.js"></script>
</body>
</html>
