<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শপ রিভিউ ভিডিও ব্যবস্থাপনা - SERA PRODUCT</title>
    <link rel="icon" type="image/png" href="https://seraproduct.com/photo/logo.png">
    <link rel="stylesheet" href="video.css">
</head>
<body>
    <!-- Header Section -->
    <header class="app-header">
        <div class="header-container">
            <div class="logo-area">
                <img src="https://seraproduct.com/photo/logo.png" alt="Sera Product Logo" class="logo-img">
                <span class="brand-title">SERA PRODUCT</span>
            </div>
            <div class="user-control-area">
                <div id="userBadgeContainer"></div>
                <span id="userEmailDisplay" class="user-email">লোড হচ্ছে...</span>
                <button id="logoutBtn" class="btn btn-danger-outline" onclick="logoutUser()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M16 17v-3H9v-4h7V7l5 5-5 5M14 2a2 2 0 0 1 2 2v2h-2V4H5v16h9v-2h2v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9z"/></svg>
                    <span>লগআউট</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        <!-- Page Title Section -->
        <section class="page-title-section">
            <h1 class="main-title">শপ রিভিউ ভিডিও ব্যবস্থাপনা</h1>
            <p class="sub-title">ইউটিউব রিভিউ ভিডিও যোগ, প্রিভিউ এবং পরিচালনা করুন</p>
        </section>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="loading-overlay hidden">
            <div class="spinner"></div>
            <p id="loadingText">লোড হচ্ছে...</p>
        </div>

        <!-- Notification Toast -->
        <div id="toastNotification" class="toast hidden"></div>

        <!-- Add/Edit Form Section -->
        <section class="card form-card">
            <h2 id="formHeading" class="card-title">নতুন রিভিউ ভিডিও যোগ করুন</h2>
            <form id="videoForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="editingVideoId" value="">
                
                <div class="form-group">
                    <label for="videoTitleInput">ভিডিওর শিরোনাম <span class="required">*</span></label>
                    <input type="text" id="videoTitleInput" class="form-control" placeholder="ভিডিওর আকর্ষণীয় শিরোনাম এখানে লিখুন" required maxlength="120">
                </div>

                <div class="form-group">
                    <label for="youtubeUrlInput">ইউটিউব ভিডিও লিংক <span class="required">*</span></label>
                    <input type="url" id="youtubeUrlInput" class="form-control" placeholder="https://www.youtube.com/watch?v=..." required oninput="handleUrlInput(this.value)">
                </div>

                <!-- Preview Area -->
                <div id="previewContainer" class="preview-container hidden">
                    <div class="preview-box">
                        <h3>ভিডিও প্রিভিউ</h3>
                        <div id="videoEmbedPreview" class="embed-preview-wrapper"></div>
                    </div>
                    <div class="preview-box">
                        <h3>থাম্বনেইল প্রিভিউ (৯:১৬)</h3>
                        <div id="thumbnailPreviewWrapper" class="thumbnail-preview-wrapper">
                            <img id="thumbnailPreviewImg" src="" alt="Thumbnail Preview">
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="saveButton" class="btn btn-primary">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4m-5 16a3 3 0 0 1-3-3 3 3 0 0 1 3-3 3 3 0 0 1 3 3 3 3 0 0 1-3 3m3-10H5V5h10v4z"/></svg>
                        <span id="saveButtonText">ভিডিও সংরক্ষণ করুন</span>
                    </button>
                    <button type="button" id="cancelEditBtn" class="btn btn-secondary hidden" onclick="resetForm()">বাতিল করুন</button>
                </div>
            </form>
        </section>

        <!-- Video List Section -->
        <section class="card list-card">
            <h2 class="card-title">সংরক্ষিত ভিডিওসমূহ</h2>
            <div id="videoGridContainer" class="video-grid">
                <!-- Dynamic Video Cards will appear here -->
            </div>
            <div class="pagination-container">
                <button id="loadMoreBtn" class="btn btn-outline hidden" onclick="loadMoreVideos()">আরও দেখুন</button>
            </div>
        </section>
    </main>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal hidden">
        <div class="modal-content">
            <h3>নিশ্চিতকরণ</h3>
            <p>আপনি কি এই ভিডিওটি মুছে ফেলতে চান?</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">বাতিল</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">মুছে ফেলুন</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module" src="video.js"></script>
</body>
</html>
