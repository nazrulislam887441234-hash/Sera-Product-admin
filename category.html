<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ক্যাটাগরি ব্যবস্থাপনা - SERA PRODUCT</title>
    <link rel="icon" type="image/png" href="https://seraproduct.com/photo/logo.png">
    <link rel="stylesheet" href="category.css">
</head>
<body>

    <!-- Full-screen Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="spinner"></div>
        <p id="loadingText">তথ্য প্রস্তুত করা হচ্ছে...</p>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Header Section -->
    <header class="app-header">
        <div class="header-brand">
            <img src="https://seraproduct.com/photo/logo.png" alt="Sera Product Logo" class="brand-logo">
            <div class="brand-titles">
                <h1>ক্যাটাগরি ব্যবস্থাপনা</h1>
                <p>পণ্যের ক্যাটাগরি তৈরি ও পরিচালনা করুন</p>
            </div>
        </div>
        <div class="header-user-panel">
            <div id="userInfoBox" class="user-info-box">
                <span id="userEmailDisplay" class="user-email">লোড হচ্ছে...</span>
                <span id="userRoleBadge" class="user-role-badge hidden"></span>
            </div>
            <button id="logoutBtn" class="btn btn-outline" title="লগআউট">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M16 17v-3H9v-4h7V7l5 5-5 5M14 2a2 2 0 0 1 2 2v2h-2V4H5v16h9v-2h2v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9z"/></svg>
                <span>লগআউট</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        
        <!-- Category Upload/Edit Form Section -->
        <section class="card form-card">
            <h2 id="formSectionTitle" class="section-title">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                নতুন ক্যাটাগরি যোগ করুন
            </h2>
            <form id="categoryForm">
                <input type="hidden" id="editingCategoryId" value="">
                
                <div class="form-grid">
                    <!-- Image Input & Preview -->
                    <div class="form-group">
                        <label class="form-label">ক্যাটাগরির ছবি (বাধ্যতামূলক)</label>
                        <div class="image-upload-container" id="imageDropZone">
                            <input type="file" id="categoryImageInput" accept="image/jpeg, image/png, image/webp, image/gif">
                            <div id="imagePreviewContent" class="image-preview-placeholder">
                                <svg class="svg-icon large-icon" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                                <span>ছবি নির্বাচন করুন</span>
                            </div>
                        </div>
                        <div id="imagePreviewCard" class="image-preview-card hidden">
                            <img id="previewImgElement" src="" alt="Preview">
                            <div class="preview-card-info">
                                <span id="previewFileName" class="file-name">image.jpg</span>
                                <button type="button" id="removeImageBtn" class="btn-remove-img" title="ছবি সরান">
                                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                                </button>
                            </div>
                        </div>
                        <small class="form-hint">সর্বোচ্চ ফাইল সাইজ ৫ মেগাবাইট (JPEG, PNG, WEBP, GIF)</small>
                    </div>

                    <!-- Text Fields & Actions -->
                    <div class="form-inputs-stack">
                        <div class="form-group">
                            <label for="categoryNameInput" class="form-label">ক্যাটাগরির নাম</label>
                            <input type="text" id="categoryNameInput" class="form-control" placeholder="যেমন: ইলেকট্রনিক্স" required>
                        </div>

                        <div class="form-group">
                            <label for="categorySlugInput" class="form-label">ক্যাটাগরি স্লাগ (স্বয়ংক্রিয়)</label>
                            <input type="text" id="categorySlugInput" class="form-control" placeholder="electronics" readonly>
                        </div>

                        <div class="form-actions-row">
                            <button type="submit" id="saveCategoryBtn" class="btn btn-primary">
                                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm2 16H5V5h11.17L19 7.83V19zm-7-7c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zM6 6h9v4H6z"/></svg>
                                <span id="saveBtnText">সংরক্ষণ করুন</span>
                            </button>
                            <button type="button" id="cancelEditBtn" class="btn btn-secondary hidden">
                                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                                বাতিল করুন
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </section>

        <!-- Search & Filter Section -->
        <section class="card search-card">
            <div class="search-wrapper">
                <input type="text" id="searchInput" class="form-control" placeholder="ক্যাটাগরির নাম বা স্লাগ লিখুন">
                <button type="button" id="searchBtn" class="btn btn-primary" title="সার্চ করুন">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <span>সার্চ</span>
                </button>
                <button type="button" id="resetSearchBtn" class="btn btn-secondary hidden" title="রিসেট">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                </button>
            </div>
        </section>

        <!-- Category List Section -->
        <section class="card list-card">
            <div class="list-header-row">
                <h2>ক্যাটাগরি তালিকা</h2>
                <div class="list-actions-right">
                    <span id="totalCountBadge" class="total-badge">মোট: ০</span>
                    <button type="button" id="copyLoadedJsonBtn" class="btn btn-outline btn-sm">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                        <span>দেখানো তথ্যের JSON কপি</span>
                    </button>
                </div>
            </div>

            <div id="categoryGrid" class="category-grid">
                <!-- Dynamic Category Cards Will Load Here -->
            </div>

            <div class="pagination-wrapper">
                <button id="loadMoreBtn" class="btn btn-outline hidden">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                    <span>আরও দেখুন</span>
                </button>
            </div>
        </section>

    </main>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal-backdrop hidden">
        <div class="modal-dialog">
            <svg class="svg-icon warning-icon" viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
            <h3>সতর্কতা</h3>
            <p>আপনি কি এই ক্যাটাগরিটি মুছে ফেলতে চান?</p>
            <div class="modal-buttons">
                <button type="button" id="cancelDeleteBtn" class="btn btn-secondary">বাতিল</button>
                <button type="button" id="confirmDeleteBtn" class="btn btn-danger">মুছে ফেলুন</button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script type="module" src="category.js"></script>
</body>
</html>
