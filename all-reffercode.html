<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রেফারেল কোড ম্যানেজমেন্ট - সেরা প্রোডাক্ট</title>
    <link rel="stylesheet" href="all-reffercode.css">
    <link rel="icon" href="https://seraproduct.com/photo/logo.png" type="image/png">
</head>
<body>

    <!-- Header Section -->
    <header class="app-header">
        <div class="header-container">
            <div class="brand-logo">
                <img src="https://seraproduct.com/photo/logo.png" alt="Sera Product Logo">
                <span>সেরা প্রোডাক্ট অ্যাডমিন</span>
            </div>
            <div class="user-profile-badge" id="userProfileBadge">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span id="userInfoText">যাচাই করা হচ্ছে...</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        
        <!-- Control Panel / Search Section -->
        <section class="control-section">
            <div class="search-box-wrapper">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="কোড, ইমেইল বা ইউআইডি দিয়ে খুঁজুন">
            </div>
        </section>

        <!-- Referral List Grid -->
        <section class="referral-section">
            <div id="referralGrid" class="referral-grid">
                <!-- Skeleton Loader -->
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>

            <!-- Load More Section -->
            <div class="load-more-wrapper" id="loadMoreWrapper" style="display: none;">
                <button id="loadMoreBtn" class="btn-primary">আরও দেখুন</button>
            </div>
        </section>

    </main>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3>রেফারেল কোড সম্পাদনা</h3>
                <button id="closeEditModal" class="icon-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editDocId">
                <div class="form-group">
                    <label>ইমেল (পরিবর্তনযোগ্য নয়)</label>
                    <input type="text" id="editEmail" readonly class="readonly-input">
                </div>
                <div class="form-group">
                    <label>ইউআইডি (পরিবর্তনযোগ্য নয়)</label>
                    <input type="text" id="editUid" readonly class="readonly-input">
                </div>
                <div class="form-group">
                    <label>তৈরির সময় (পরিবর্তনযোগ্য নয়)</label>
                    <input type="text" id="editCreatedAt" readonly class="readonly-input">
                </div>
                <div class="form-group">
                    <label>রেফারেল কোড</label>
                    <input type="text" id="editCodeInput" placeholder="নতুন কোড লিখুন">
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelEditBtn" class="btn-secondary">বাতিল</button>
                <button id="saveEditBtn" class="btn-primary">সংরক্ষণ করুন</button>
            </div>
        </div>
    </div>

    <!-- Reseller Info Modal -->
    <div id="resellerModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3>রিসেলারের তথ্য</h3>
                <button id="closeResellerModal" class="icon-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body" id="resellerModalBody">
                <!-- Dynamic Content -->
            </div>
            <div class="modal-footer">
                <button id="closeResellerBtn" class="btn-secondary">বন্ধ করুন</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal-overlay" style="display: none;">
        <div class="modal-box confirm-box">
            <div class="modal-header">
                <h3>রেফারেল কোড মুছে ফেলবেন?</h3>
            </div>
            <div class="modal-body">
                <p>এই কাজটি করলে রেফারেল কোডটি স্থায়ীভাবে মুছে যাবে।</p>
            </div>
            <div class="modal-footer">
                <button id="cancelDeleteBtn" class="btn-secondary">বাতিল</button>
                <button id="confirmDeleteBtn" class="btn-danger">মুছে ফেলুন</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>
<script type="module" src="all-reffercode.js"></script>
</body>
</html>
